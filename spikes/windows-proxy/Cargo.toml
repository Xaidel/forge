[package]
name = "forge-windows-proxy-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mxc-sdk = "=1.0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[[bin]]
name = "proxy-spike"
path = "src/bin/proxy-spike.rs"

[[bin]]
name = "proxy-client"
path = "src/bin/proxy-client.rs"

[[bin]]
name = "appcontainer-probe"
path = "src/bin/appcontainer-probe.rs"
